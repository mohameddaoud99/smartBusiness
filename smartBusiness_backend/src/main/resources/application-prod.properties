# -------------------------------------------------------
# Production profile — java -jar smartBusiness.jar --spring.profiles.active=prod
#
# Nothing below has a default on purpose: a missing variable stops the start-up instead of
# running with a well-known secret or password.
#   DB_URL                     jdbc:postgresql://host:5432/smartBusiness
#   DB_USERNAME / DB_PASSWORD
#   JWT_SECRET                 at least 32 random bytes
#   CORS_ALLOWED_ORIGINS       https://erp.example.com  (where the Angular app is served)
#   UPLOADS_DIR                a directory that survives a redeploy (logos, stamps)
# The first run also needs PLATFORM_ADMIN_EMAIL / PLATFORM_ADMIN_PASSWORD (see application.properties).
# -------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

smartbusiness.jwt.secret=${JWT_SECRET}
smartbusiness.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
smartbusiness.uploads.dir=${UPLOADS_DIR}

spring.jpa.properties.hibernate.format_sql=false
