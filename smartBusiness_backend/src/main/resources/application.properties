spring.application.name=smartBusiness

# Server
server.port=8080

# -------------------------------------------------------
# Database — update credentials to match your local setup
# -------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/smartBusiness
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway — runs migrations from src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -------------------------------------------------------
# JWT — the default secret is for local development only.
# Set JWT_SECRET in the environment for any deployed instance.
# HS256 requires at least 32 bytes.
# -------------------------------------------------------
smartbusiness.jwt.secret=${JWT_SECRET:local-development-secret-change-me-before-any-deployment}
smartbusiness.jwt.expiration=PT8H

# -------------------------------------------------------
# Login lockout — a user is locked out for smartbusiness.login.lockout-duration after this many
# wrong passwords in a row (reset by a successful sign-in). Defends the login endpoint, which has
# no other rate limit.
# -------------------------------------------------------
smartbusiness.login.lockout-threshold=5
smartbusiness.login.lockout-duration=PT15M

# -------------------------------------------------------
# File uploads — company logo and stamp, stored on disk under this directory
# (see CompanyImageStorage). Business rule caps images at 1 MB; these limits are
# the hard backstop enforced by the servlet container.
# -------------------------------------------------------
smartbusiness.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# -------------------------------------------------------
# Platform admin — created once at startup if none exists yet (see
# PlatformAdminBootstrap). No default on purpose: a credential committed here would be
# a way into every company. Set both variables for the first run only; they have no
# effect once a platform admin already exists.
# -------------------------------------------------------
smartbusiness.platform-admin.email=${PLATFORM_ADMIN_EMAIL:}
smartbusiness.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:}
