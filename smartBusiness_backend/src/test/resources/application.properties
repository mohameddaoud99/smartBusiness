# Test configuration — shadows src/main/resources/application.properties entirely.
#
# Tests run against their own database, recreated from scratch on every run by
# IntegrationTest. The development database is never touched by `mvn test`.

spring.application.name=smartBusiness

spring.datasource.url=jdbc:postgresql://localhost:5432/smartbusiness_test
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

smartbusiness.jwt.secret=test-only-secret-long-enough-for-hmac-sha-signing-do-not-reuse
smartbusiness.jwt.expiration=PT1H

# Uploaded test images land under target/, wiped by `mvn clean`
smartbusiness.uploads.dir=target/test-uploads

# Deterministic platform admin, so tests can log into the platform portal
smartbusiness.platform-admin.email=platform-admin@test.local
smartbusiness.platform-admin.password=PlatformPass123
