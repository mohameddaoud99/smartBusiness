<app-page-header
  title="Branches"
  description="The sites your company operates from">
  <p-button
    *appHasPermission="'BRANCH_CREATE'"
    label="New branch"
    icon="pi pi-plus"
    size="small"
    (onClick)="openCreate()" />
</app-page-header>

<div class="surface-panel">
  <p-table
    [value]="branches()"
    [loading]="loading()"
    [lazy]="true"
    (onLazyLoad)="load($event)"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [totalRecords]="totalRecords()"
    dataKey="id"
    styleClass="p-datatable-sm"
    responsiveLayout="scroll"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} branches"
    [showCurrentPageReport]="true">

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 120px">Code</th>
        <th style="min-width: 200px">Name</th>
        <th style="min-width: 240px">Address</th>
        <th style="min-width: 140px">Phone</th>
        <th style="width: 110px">Status</th>
        <th style="width: 96px"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-branch>
      <tr>
        <td><span class="mono">{{ branch.code }}</span></td>
        <td class="text-strong">{{ branch.name }}</td>
        <td class="text-muted">{{ branch.address || '—' }}</td>
        <td>{{ branch.phone || '—' }}</td>
        <td>
          <p-tag
            [value]="branch.status === 'ACTIVE' ? 'Active' : 'Inactive'"
            [severity]="branch.status === 'ACTIVE' ? 'success' : 'secondary'" />
        </td>
        <td>
          <p-button
            *appHasPermission="'BRANCH_UPDATE'"
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            size="small"
            pTooltip="Edit"
            tooltipPosition="left"
            (onClick)="openEdit(branch)" />

          @if (branch.status === 'ACTIVE') {
            <p-button
              *appHasPermission="'BRANCH_DISABLE'"
              icon="pi pi-ban"
              severity="secondary"
              [text]="true"
              size="small"
              pTooltip="Deactivate"
              tooltipPosition="left"
              (onClick)="confirmDeactivate(branch)" />
          } @else {
            <p-button
              *appHasPermission="'BRANCH_DISABLE'"
              icon="pi pi-check"
              severity="secondary"
              [text]="true"
              size="small"
              pTooltip="Activate"
              tooltipPosition="left"
              (onClick)="activate(branch)" />
          }
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="empty-state">
          <i class="pi pi-building empty-icon"></i>
          <p class="empty-title">No branches yet</p>
          <p class="empty-text">Add the shops, warehouses or agencies you operate from.</p>
          <p-button
            *appHasPermission="'BRANCH_CREATE'"
            label="New branch"
            icon="pi pi-plus"
            size="small"
            (onClick)="openCreate()" />
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>

<app-branch-form (saved)="refresh()" />
