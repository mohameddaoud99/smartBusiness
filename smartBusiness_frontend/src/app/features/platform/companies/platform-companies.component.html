<app-page-header
  title="Companies"
  description="Every company on the platform, and which modules each one can use">
</app-page-header>

<div class="surface-panel">

  <div class="table-toolbar">
    <p-iconfield styleClass="toolbar-search">
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="text"
        placeholder="Search by company name"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange()" />
    </p-iconfield>
  </div>

  <p-table
    [value]="companies()"
    [loading]="loading()"
    [lazy]="true"
    (onLazyLoad)="load($event)"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[20, 50, 100]"
    [totalRecords]="totalRecords()"
    dataKey="id"
    styleClass="p-datatable-sm"
    responsiveLayout="scroll"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} companies"
    [showCurrentPageReport]="true">

    <ng-template pTemplate="header">
      <tr>
        <th style="min-width: 220px">Company</th>
        <th style="min-width: 260px">Modules</th>
        <th style="width: 110px">Status</th>
        <th style="width: 130px">Created</th>
        <th style="width: 140px"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-company>
      <tr>
        <td>
          <div class="company-cell">
            <span class="company-name">{{ company.name }}</span>
            @if (company.email) {
              <span class="company-email">{{ company.email }}</span>
            }
          </div>
        </td>
        <td class="text-muted">{{ moduleSummary(company) }}</td>
        <td>
          <p-tag
            [value]="company.status === 'ACTIVE' ? 'Active' : 'Suspended'"
            [severity]="company.status === 'ACTIVE' ? 'success' : 'danger'" />
        </td>
        <td class="text-muted">{{ company.createdAt | date: 'dd MMM yyyy' }}</td>
        <td>
          <p-button
            label="Manage modules"
            icon="pi pi-sliders-h"
            severity="secondary"
            [outlined]="true"
            size="small"
            (onClick)="manageModules(company)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty-state">
          <i class="pi pi-building empty-icon"></i>
          <p class="empty-title">No companies yet</p>
          <p class="empty-text">Companies appear here as soon as they sign up.</p>
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>

<app-company-modules-dialog (saved)="refresh()" />
