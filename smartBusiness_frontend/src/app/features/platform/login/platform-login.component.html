<div class="platform-login-page">
  <div class="platform-login-card">

    <div class="platform-brand">
      <i class="pi pi-shield"></i>
      <span>SmartBusiness Platform</span>
    </div>

    <header class="auth-head">
      <h2>Platform sign in</h2>
      <p>Restricted access — for platform operators only.</p>
    </header>

    @if (errorMessage()) {
      <p-message severity="error" styleClass="w-full auth-error">
        {{ errorMessage() }}
      </p-message>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="field">
        <label for="email">Email <span class="required">*</span></label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          class="w-full"
          autocomplete="username"
          [class.ng-invalid]="isInvalid('email')"
          [class.ng-dirty]="isInvalid('email')" />
        @if (isInvalid('email')) {
          <small class="p-error">Enter a valid email address.</small>
        }
      </div>

      <div class="field">
        <label for="password">Password <span class="required">*</span></label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="current-password" />
        @if (isInvalid('password')) {
          <small class="p-error">Your password is required.</small>
        }
      </div>

      <p-button
        label="Sign in"
        type="submit"
        styleClass="w-full"
        [loading]="submitting()" />

    </form>

  </div>
</div>
