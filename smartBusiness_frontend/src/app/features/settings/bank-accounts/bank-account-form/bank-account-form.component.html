<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [closable]="!saving()"
  [style]="{ width: '520px' }"
  [header]="title()"
  (onHide)="close()">

  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="field">
      <label for="label">Label <span class="required">*</span></label>
      <input
        pInputText
        id="label"
        formControlName="label"
        class="w-full"
        placeholder="Main account — BIAT"
        [class.ng-invalid]="isInvalid('label')"
        [class.ng-dirty]="isInvalid('label')" />
      @if (isInvalid('label')) {
        <small class="p-error">{{ errorFor('label') }}</small>
      }
    </div>

    <div class="field">
      <label for="bankName">Bank</label>
      <input pInputText id="bankName" formControlName="bankName" class="w-full" />
    </div>

    <div class="field">
      <label for="rib">RIB / IBAN <span class="required">*</span></label>
      <input
        pInputText
        id="rib"
        formControlName="rib"
        class="w-full"
        [class.ng-invalid]="isInvalid('rib')"
        [class.ng-dirty]="isInvalid('rib')" />
      @if (isInvalid('rib')) {
        <small class="p-error">{{ errorFor('rib') }}</small>
      } @else {
        <small class="field-hint">The account identifier printed on your documents.</small>
      }
    </div>

    <div class="field">
      <label for="currency">Currency <span class="required">*</span></label>
      <p-select
        inputId="currency"
        formControlName="currency"
        [options]="currencyOptions"
        optionLabel="label"
        optionValue="value"
        [filter]="true"
        styleClass="w-full" />
    </div>

    <div class="field-checkbox">
      <p-checkbox formControlName="showOnDocuments" [binary]="true" inputId="showOnDocuments" />
      <label for="showOnDocuments">Show this account on sales documents</label>
    </div>

    <div class="form-actions">
      <p-button
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        size="small"
        [disabled]="saving()"
        (onClick)="close()" />
      <p-button
        [label]="editing() ? 'Save changes' : 'Add account'"
        type="submit"
        size="small"
        [loading]="saving()" />
    </div>

  </form>

</p-dialog>
