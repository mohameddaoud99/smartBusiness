<app-page-header
  title="Brands"
  description="Manufacturer labels shown on products">
  <p-button
    *appHasPermission="'PRODUCT_CREATE'"
    label="New brand"
    icon="pi pi-plus"
    size="small"
    (onClick)="openCreate()" />
</app-page-header>

<div class="surface-panel">
  <p-table
    [value]="brands()"
    [loading]="loading()"
    dataKey="id"
    styleClass="p-datatable-sm"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th style="min-width: 220px">Name</th>
        <th style="width: 110px">Products</th>
        <th style="width: 96px"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-brand>
      <tr>
        <td class="text-strong">{{ brand.name }}</td>
        <td><p-tag [value]="brand.productCount" severity="secondary" /></td>
        <td>
          <p-button
            *appHasPermission="'PRODUCT_UPDATE'"
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            size="small"
            pTooltip="Edit"
            tooltipPosition="left"
            (onClick)="openEdit(brand)" />
          <p-button
            *appHasPermission="'PRODUCT_DELETE'"
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            size="small"
            pTooltip="Delete"
            tooltipPosition="left"
            (onClick)="confirmDelete(brand)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="empty-state">
          <i class="pi pi-tag empty-icon"></i>
          <p class="empty-title">No brands yet</p>
          <p class="empty-text">Add the manufacturer labels your products carry.</p>
          <p-button
            *appHasPermission="'PRODUCT_CREATE'"
            label="New brand"
            icon="pi pi-plus"
            size="small"
            (onClick)="openCreate()" />
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>

<app-brand-form (saved)="load()" />
