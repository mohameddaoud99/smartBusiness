<app-page-header
  title="Categories"
  description="Product families, optionally nested under one another">
  <p-button
    *appHasPermission="'PRODUCT_CREATE'"
    label="New category"
    icon="pi pi-plus"
    size="small"
    (onClick)="openCreate()" />
</app-page-header>

<div class="surface-panel">
  <p-table
    [value]="categories()"
    [loading]="loading()"
    dataKey="id"
    styleClass="p-datatable-sm"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th style="min-width: 220px">Name</th>
        <th style="min-width: 180px">Parent</th>
        <th style="width: 110px">Products</th>
        <th style="width: 96px"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-category>
      <tr>
        <td class="text-strong">{{ category.name }}</td>
        <td class="text-muted">{{ category.parentName || '—' }}</td>
        <td><p-tag [value]="category.productCount" severity="secondary" /></td>
        <td>
          <p-button
            *appHasPermission="'PRODUCT_UPDATE'"
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            size="small"
            pTooltip="Edit"
            tooltipPosition="left"
            (onClick)="openEdit(category)" />
          <p-button
            *appHasPermission="'PRODUCT_DELETE'"
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            size="small"
            pTooltip="Delete"
            tooltipPosition="left"
            (onClick)="confirmDelete(category)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="empty-state">
          <i class="pi pi-sitemap empty-icon"></i>
          <p class="empty-title">No categories yet</p>
          <p class="empty-text">Group your products into families to make them easier to find.</p>
          <p-button
            *appHasPermission="'PRODUCT_CREATE'"
            label="New category"
            icon="pi pi-plus"
            size="small"
            (onClick)="openCreate()" />
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>

<app-category-form (saved)="load()" />
