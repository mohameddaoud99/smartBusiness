<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [closable]="!saving()"
  [style]="{ width: '480px' }"
  [header]="title()"
  (onHide)="close()">

  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="preview-box">
      <span class="preview-label">Next number</span>
      <span class="preview-value">{{ preview }}</span>
    </div>

    <div class="field">
      <label for="prefix">Prefix <span class="required">*</span></label>
      <input
        pInputText
        id="prefix"
        formControlName="prefix"
        class="w-full"
        placeholder="INV"
        [class.ng-invalid]="isInvalid('prefix')"
        [class.ng-dirty]="isInvalid('prefix')" />
      @if (isInvalid('prefix')) {
        <small class="p-error">{{ errorFor('prefix') }}</small>
      }
    </div>

    <div class="field-grid">
      <div class="field">
        <label for="padding">Counter length <span class="required">*</span></label>
        <p-inputnumber
          inputId="padding"
          formControlName="padding"
          [min]="1"
          [max]="10"
          [showButtons]="true"
          styleClass="w-full"
          [inputStyleClass]="'w-full'" />
        @if (isInvalid('padding')) {
          <small class="p-error">{{ errorFor('padding') }}</small>
        }
      </div>

      <div class="field">
        <label for="nextValue">Next value <span class="required">*</span></label>
        <p-inputnumber
          inputId="nextValue"
          formControlName="nextValue"
          [min]="1"
          styleClass="w-full"
          [inputStyleClass]="'w-full'" />
        @if (isInvalid('nextValue')) {
          <small class="p-error">{{ errorFor('nextValue') }}</small>
        }
      </div>
    </div>

    <div class="field-checkbox">
      <p-checkbox formControlName="includeYear" [binary]="true" inputId="includeYear" />
      <label for="includeYear">Include the year in the number</label>
    </div>

    <div class="field-checkbox">
      <p-checkbox formControlName="active" [binary]="true" inputId="active" />
      <label for="active">Use this sequence</label>
    </div>

    <div class="form-actions">
      <p-button
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        size="small"
        [disabled]="saving()"
        (onClick)="close()" />
      <p-button
        label="Save changes"
        type="submit"
        size="small"
        [loading]="saving()" />
    </div>

  </form>

</p-dialog>
