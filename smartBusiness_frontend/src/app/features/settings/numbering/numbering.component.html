<app-page-header
  title="Document numbering"
  description="The prefix and counter for each type of document">
</app-page-header>

<div class="surface-panel">
  <p-table
    [value]="sequences()"
    [loading]="loading()"
    dataKey="documentType"
    styleClass="p-datatable-sm"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th style="min-width: 180px">Document</th>
        <th style="min-width: 200px">Next number</th>
        <th style="width: 90px">Status</th>
        <th style="width: 72px"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-sequence>
      <tr>
        <td class="text-strong">{{ sequence.documentTypeLabel }}</td>
        <td><span class="mono preview">{{ sequence.preview }}</span></td>
        <td>
          <p-tag
            [value]="sequence.active ? 'On' : 'Off'"
            [severity]="sequence.active ? 'success' : 'secondary'" />
        </td>
        <td>
          <p-button
            *appHasPermission="'COMPANY_UPDATE'"
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            size="small"
            pTooltip="Edit"
            tooltipPosition="left"
            (onClick)="openEdit(sequence)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="empty-state">
          <i class="pi pi-hashtag empty-icon"></i>
          <p class="empty-title">No sequences</p>
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>

<app-numbering-form (saved)="load()" />
