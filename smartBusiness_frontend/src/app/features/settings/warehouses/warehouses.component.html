<app-page-header
  title="Warehouses"
  description="Where your stock is kept">
  <p-button
    *appHasPermission="'STOCK_ADJUST'"
    label="New warehouse"
    icon="pi pi-plus"
    size="small"
    (onClick)="openCreate()" />
</app-page-header>

<div class="surface-panel">
  <p-table
    [value]="warehouses()"
    [loading]="loading()"
    dataKey="id"
    styleClass="p-datatable-sm"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th style="min-width: 220px">Name</th>
        <th style="min-width: 220px">Address</th>
        <th style="width: 110px">Status</th>
        <th style="width: 96px"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-warehouse>
      <tr>
        <td class="text-strong">
          {{ warehouse.name }}
          @if (warehouse.defaultWarehouse) {
            <p-tag value="Default" severity="info" styleClass="default-tag" />
          }
        </td>
        <td class="text-muted">{{ warehouse.address || '—' }}</td>
        <td>
          <p-tag
            [value]="warehouse.active ? 'Active' : 'Inactive'"
            [severity]="warehouse.active ? 'success' : 'secondary'" />
        </td>
        <td>
          <p-button
            *appHasPermission="'STOCK_ADJUST'"
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            size="small"
            pTooltip="Edit"
            tooltipPosition="left"
            (onClick)="openEdit(warehouse)" />
          @if (!warehouse.defaultWarehouse) {
            <p-button
              *appHasPermission="'STOCK_ADJUST'"
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              size="small"
              pTooltip="Delete"
              tooltipPosition="left"
              (onClick)="confirmDelete(warehouse)" />
          }
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="empty-state">
          <i class="pi pi-warehouse empty-icon"></i>
          <p class="empty-title">No warehouses yet</p>
          <p class="empty-text">Add the places your stock is kept.</p>
          <p-button
            *appHasPermission="'STOCK_ADJUST'"
            label="New warehouse"
            icon="pi pi-plus"
            size="small"
            (onClick)="openCreate()" />
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>

<app-warehouse-form (saved)="load()" />
